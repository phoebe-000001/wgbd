<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贏界 Wingea · 遊戲抽點表</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
/* ── Login screen ── */
.login-screen{position:fixed;inset:0;background:#f7f6f3;z-index:9999;display:flex;align-items:center;justify-content:center;}
.login-card{background:#fff;border:1px solid #e2e0d8;border-radius:16px;padding:40px 48px;text-align:center;max-width:380px;width:100%;}
.login-logo{width:48px;height:48px;background:#2a5cff;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.login-logo-dot{width:22px;height:22px;background:#fff;border-radius:50%;}
.login-title{font-size:18px;font-weight:600;color:#1a1917;margin-bottom:6px;}
.login-sub{font-size:13px;color:#6b6860;margin-bottom:28px;}
.login-err{font-size:12px;color:#b91c1c;margin-top:14px;padding:8px 12px;background:#fee2e2;border-radius:8px;display:none;}
</style>
<style>
:root{
  --bg:#f7f6f3;--sur:#fff;--sur2:#f0efe9;--bdr:#e2e0d8;--bdr2:#ccc9bc;
  --t:#1a1917;--t2:#6b6860;--t3:#9e9b93;
  --accent:#2a5cff;--abg:#eef2ff;--ahov:#1a4ce0;
  --green:#1a7a4a;--red:#b91c1c;--redbg:#fee2e2;--yellow:#92400e;
  --mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--t);min-height:100vh;}

.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:300;}
.logo{font-size:14px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
.logo-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;}
.sync{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:6px;}
.sync-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.page{max-width:1600px;margin:0 auto;padding:20px 28px;}

/* ── Filter bar ── */
.filter-bar{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;margin-bottom:14px;overflow:visible;}
.frow{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--bdr);}
.frow:last-child{border-bottom:none;}
.flbl{width:88px;flex-shrink:0;padding:0 14px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;border-right:1px solid var(--bdr);align-self:stretch;display:flex;align-items:center;}
.fcontent{flex:1;padding:6px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* search */
.srch{position:relative;flex:1;min-width:200px;max-width:420px;}
.sicon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px;pointer-events:none;}
input[type=text]{width:100%;height:32px;padding:0 10px 0 30px;font-size:13px;font-family:var(--sans);border:1px solid var(--bdr);border-radius:8px;background:var(--sur2);color:var(--t);outline:none;}
input[type=text]:focus{border-color:var(--accent);background:#fff;}

/* ── Searchable dropdown ── */
.dd{position:relative;flex-shrink:0;}
.dd-btn{height:32px;padding:0 28px 0 11px;border:1px solid var(--bdr);border-radius:8px;background:var(--sur2);color:var(--t);font-size:12px;font-family:var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;position:relative;user-select:none;transition:border-color .15s;}
.dd-btn::after{content:"▾";position:absolute;right:9px;font-size:9px;color:var(--t3);}
.dd-btn.open,.dd-btn:hover{border-color:var(--bdr2);}
.dd-btn.open{border-color:var(--accent);background:var(--sur);}
.dd-btn.has{border-color:var(--accent);}
.dd-badge{background:var(--accent);color:#fff;border-radius:10px;font-size:10px;font-weight:500;padding:1px 6px;min-width:18px;text-align:center;}
.dd-menu{position:absolute;top:calc(100% + 5px);left:0;min-width:220px;background:var(--sur);border:1px solid var(--bdr2);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:400;overflow:hidden;}
.dd-srch{padding:8px 8px 6px;border-bottom:1px solid var(--bdr);}
.dd-srch input{width:100%;height:28px;padding:0 8px;font-size:12px;font-family:var(--sans);border:1px solid var(--bdr);border-radius:6px;background:var(--sur2);color:var(--t);outline:none;}
.dd-srch input:focus{border-color:var(--accent);}
.dd-list{max-height:210px;overflow-y:auto;}
.dd-item{display:flex;align-items:center;gap:8px;padding:7px 11px;font-size:12px;cursor:pointer;color:var(--t);}
.dd-item:hover{background:var(--sur2);}
.dd-item.on{background:var(--sur2);}
.dd-cb{width:13px;height:13px;border:1px solid var(--bdr2);border-radius:3px;background:var(--sur);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;}
.dd-item.on .dd-cb{background:var(--accent);border-color:var(--accent);}
.dd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dd-foot{padding:6px 8px;border-top:1px solid var(--bdr);display:flex;gap:5px;}
.dd-clr{flex:1;height:24px;font-size:11px;border:1px solid var(--bdr);border-radius:6px;background:transparent;color:var(--t2);cursor:pointer;font-family:var(--sans);}
.dd-all{flex:1;height:24px;font-size:11px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-family:var(--sans);}
.dd-empty{padding:14px;text-align:center;font-size:12px;color:var(--t3);}

/* sel strip */
.sel-strip{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:5px 12px 7px;border-bottom:1px solid var(--bdr);}
.sel-tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-size:11px;background:var(--sur2);border:1px solid var(--bdr);color:var(--t2);}
.sel-tag .rm{cursor:pointer;color:var(--t3);line-height:1;}
.sel-tag .rm:hover{color:var(--t);}

/* col toggles */
.ck-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.cklbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-right:4px;}
.ck{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);cursor:pointer;user-select:none;}
.ck input{cursor:pointer;accent-color:var(--accent);}
.ck:has(input:checked){color:var(--t);}
.factions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0;}
.btn{height:32px;padding:0 13px;font-size:12px;font-family:var(--sans);font-weight:500;border-radius:8px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.btn-pri{background:var(--accent);color:#fff;}
.btn-pri:hover{background:var(--ahov);}
.btn-gho{background:transparent;color:var(--t2);border:1px solid var(--bdr);}
.btn-gho:hover{background:var(--sur2);}
.btn-dan{background:var(--redbg);color:var(--red);border:1px solid #fca5a5;}
.btn-sm{height:24px;padding:0 9px;font-size:11px;border-radius:6px;}
.tabs{display:flex;gap:2px;background:var(--sur2);border-radius:8px;padding:3px;}
.tab{height:26px;padding:0 12px;font-size:12px;font-family:var(--sans);font-weight:500;border:none;border-radius:6px;background:transparent;color:var(--t2);cursor:pointer;}
.tab.on{background:var(--sur);color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* currency switcher */
.cur-tabs{display:flex;gap:2px;}
.cur-tab{height:28px;padding:0 12px;font-size:11px;font-family:var(--mono);font-weight:500;border:1px solid var(--bdr);border-radius:6px;background:var(--sur2);color:var(--t2);cursor:pointer;transition:all .12s;}
.cur-tab:hover{border-color:var(--bdr2);color:var(--t);}
.cur-tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── State ── */
.state{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:60px;text-align:center;color:var(--t2);}
.spin{width:26px;height:26px;border:2px solid var(--bdr);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Table ── */
.tbl-wrap{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;}
.tbl-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--sur2);color:var(--t2);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--t);}
thead th.sorted{color:var(--t);}
thead th.r{text-align:right;}
thead th.orig-h{text-align:right;color:var(--t3)!important;}
.sarr{font-size:9px;margin-left:2px;opacity:.4;}
thead th.sorted .sarr{opacity:1;}
tbody tr{border-bottom:1px solid var(--bdr);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--sur2);}
td{padding:7px 10px;white-space:nowrap;vertical-align:middle;color:var(--t);}
.td-en{font-size:12px;}
.td-cn{font-size:10px;color:var(--t2);margin-top:1px;}
.td-note{font-size:10px;color:var(--t3);margin-top:1px;}
.td-rc{text-align:right;}
.td-ctr{text-align:center;}
.mono{font-family:var(--mono);font-size:10px;color:var(--t2);}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;}
.b-slots{background:#dbeafe;color:#1d4ed8;} .b-live{background:#d1fae5;color:#065f46;}
.b-sports{background:#fef3c7;color:#92400e;} .b-lottery{background:#ede9fe;color:#5b21b6;}
.b-fish{background:#dcfce7;color:#166534;} .b-poker{background:#fce7f3;color:#9d174d;}
.b-mini{background:#ffedd5;color:#9a3412;} .b-esports{background:#e0f2fe;color:#0c4a6e;}
.b-cock{background:#fee2e2;color:#991b1b;}
.src-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;background:var(--sur2);border:1px solid var(--bdr);color:var(--t2);font-family:var(--mono);}
.rc-click{text-align:right;cursor:pointer;}
.rc-click:hover{background:var(--abg);}
.null-cell{text-align:center;color:var(--t3);cursor:pointer;font-size:14px;}
.null-cell:hover{color:var(--accent);}
.profit{font-size:10px;color:var(--green);margin-top:1px;}
.cy{color:var(--green);} .cn2{color:var(--t3);}
.na-cell{text-align:right;color:var(--t3);font-size:11px;}
.abtns{display:flex;gap:4px;justify-content:center;}
.tbl-footer{padding:9px 14px;font-size:11px;color:var(--t3);border-top:1px solid var(--bdr);}

/* site view */
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.sc{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;}
.sc-head{padding:12px 16px 10px;background:var(--sur2);border-bottom:1px solid var(--bdr);}
.sc-name{font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:7px;}
.sc-id{font-size:10px;font-family:var(--mono);color:var(--t2);font-weight:400;}
.sc-backend{font-size:10px;font-family:var(--mono);color:var(--t3);margin-top:2px;}
.sc-body{padding:12px 16px;}
.sc-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:12px;}
.sc-row:last-child{border-bottom:none;}
.sc-lbl{color:var(--t2);} .sc-val{font-weight:500;} .sc-val.warn{color:var(--yellow);}
.sc-count{margin-top:8px;padding:6px 12px;background:var(--abg);border-radius:8px;font-size:11px;color:var(--accent);font-weight:500;text-align:center;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--sur);border-radius:16px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.22);}
.mo-hd{padding:18px 22px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--sur);z-index:10;}
.mo-title{font-size:15px;font-weight:600;}
.mo-x{background:none;border:none;font-size:20px;color:var(--t2);cursor:pointer;padding:2px 6px;border-radius:6px;}
.mo-x:hover{background:var(--sur2);}
.mo-body{padding:20px 22px;}
.mo-foot{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--sur);}
.mo-sec{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid var(--bdr);margin:18px 0 12px;}
.mo-sec:first-child{margin-top:0;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.fgp{display:flex;flex-direction:column;gap:4px;}
.fgp.full{grid-column:1/-1;}
.fl{font-size:10px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;}
.fi{height:34px;padding:0 9px;font-size:13px;font-family:var(--sans);border:1px solid var(--bdr);border-radius:8px;background:var(--sur2);color:var(--t);outline:none;width:100%;}
.fi:focus{border-color:var(--accent);background:#fff;}
.fsel{height:34px;padding:0 9px;font-size:13px;font-family:var(--sans);border:1px solid var(--bdr);border-radius:8px;background:var(--sur2);color:var(--t);outline:none;cursor:pointer;width:100%;}
.fsel:focus{border-color:var(--accent);}
.site-block{border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:8px;}
.site-block:last-child{margin-bottom:0;}
.sb-hd{padding:9px 13px;background:var(--sur2);display:flex;align-items:center;justify-content:space-between;}
.sb-name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;}
.sb-id{font-size:10px;font-family:var(--mono);color:var(--t2);font-weight:400;}
.sb-tog{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);}
.tog-track{width:30px;height:16px;border-radius:8px;background:var(--bdr2);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;}
.tog-track.on{background:var(--accent);}
.tog-thumb{width:12px;height:12px;border-radius:6px;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;}
.tog-track.on .tog-thumb{left:16px;}
.sb-body{padding:10px 13px;display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.sb-body.dim{opacity:.3;pointer-events:none;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--t);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{background:var(--red);}
</style>
</head>
<body>

<!-- ── Login screen ── -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><div class="login-logo-dot"></div></div>
    <div class="login-title">贏界 Wingea</div>
    <div class="login-sub">請用 wingea.vip 帳號登入</div>
    <div id="g_id_signin"></div>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<header class="hdr">
  <div class="logo"><div class="logo-dot"></div>贏界 Wingea · 遊戲抽點表</div>
  <div class="sync"><div class="sync-dot"></div><span id="syncLabel">連接中…</span></div>
  <div id="userInfo" style="display:flex;align-items:center;margin-left:16px;"></div>
</header>

<div class="page">
<div class="filter-bar">

  <!-- 搜尋 -->
  <div class="frow">
    <div class="flbl">搜尋</div>
    <div class="fcontent">
      <div class="srch">
        <span class="sicon">⌕</span>
        <input type="text" id="q" placeholder="供應商名稱、provider_code、遊戲來源…" oninput="render()">
      </div>
    </div>
  </div>

  <!-- 類別 -->
  <div class="frow">
    <div class="flbl">類別</div>
    <div class="fcontent">
      <div class="dd" id="dd_cat">
        <div class="dd-btn" id="dd_cat_btn" onclick="toggleDD('cat')">
          類別 <span class="dd-badge" id="dd_cat_badge" style="display:none">0</span>
        </div>
        <div class="dd-menu" id="dd_cat_menu" style="display:none">
          <div class="dd-srch"><input type="text" placeholder="搜尋…" oninput="renderDDList('cat',this.value)" onclick="event.stopPropagation()"></div>
          <div class="dd-list" id="dd_cat_list"></div>
          <div class="dd-foot">
            <button class="dd-clr" onclick="clearDD('cat');event.stopPropagation()">清除</button>
            <button class="dd-all" onclick="allDD('cat');event.stopPropagation()">全選</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 遊戲來源 -->
  <div class="frow">
    <div class="flbl">遊戲來源</div>
    <div class="fcontent">
      <div class="dd" id="dd_src">
        <div class="dd-btn" id="dd_src_btn" onclick="toggleDD('src')">
          遊戲來源 <span class="dd-badge" id="dd_src_badge" style="display:none">0</span>
        </div>
        <div class="dd-menu" id="dd_src_menu" style="display:none">
          <div class="dd-srch"><input type="text" placeholder="搜尋…" oninput="renderDDList('src',this.value)" onclick="event.stopPropagation()"></div>
          <div class="dd-list" id="dd_src_list"></div>
          <div class="dd-foot">
            <button class="dd-clr" onclick="clearDD('src');event.stopPropagation()">清除</button>
            <button class="dd-all" onclick="allDD('src');event.stopPropagation()">全選</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 站點 -->
  <div class="frow">
    <div class="flbl">站點</div>
    <div class="fcontent">
      <div class="dd" id="dd_site">
        <div class="dd-btn" id="dd_site_btn" onclick="toggleDD('site')">
          站點 <span class="dd-badge" id="dd_site_badge" style="display:none">0</span>
        </div>
        <div class="dd-menu" id="dd_site_menu" style="display:none">
          <div class="dd-srch"><input type="text" placeholder="搜尋…" oninput="renderDDList('site',this.value)" onclick="event.stopPropagation()"></div>
          <div class="dd-list" id="dd_site_list"></div>
          <div class="dd-foot">
            <button class="dd-clr" onclick="clearDD('site');event.stopPropagation()">清除</button>
            <button class="dd-all" onclick="allDD('site');event.stopPropagation()">全選</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 已選標籤 -->
  <div id="selStrip" style="display:none" class="sel-strip"></div>

  <!-- 幣別 + 費率欄位 + 欄位顯示 + 操作 -->
  <div class="frow">
    <div class="flbl">幣別</div>
    <div class="fcontent">
      <div class="cur-tabs" id="curTabs">
        <button class="cur-tab on" onclick="setCur('CNY',this)">CNY</button>
        <button class="cur-tab" onclick="setCur('VND',this)">VND</button>
        <button class="cur-tab" onclick="setCur('USD',this)">USD</button>
        <button class="cur-tab" onclick="setCur('INR',this)">INR</button>
        <button class="cur-tab" onclick="setCur('KRW',this)">KRW</button>
        <button class="cur-tab" onclick="setCur('PHP',this)">PHP</button>
      </div>
    </div>
  </div>

  <div class="frow">
    <div class="flbl">費率欄位</div>
    <div class="fcontent">
      <div class="ck-row">
        <label class="ck"><input type="checkbox" id="ck_p1" checked onchange="render()"> 方案一</label>
        <label class="ck"><input type="checkbox" id="ck_p2" checked onchange="render()"> 方案二</label>
        <label class="ck"><input type="checkbox" id="ck_p3" onchange="render()"> 方案三</label>
        <label class="ck"><input type="checkbox" id="ck_official" checked onchange="render()"> 官方費率</label>
        <label class="ck"><input type="checkbox" id="ck_orig" checked onchange="render()"> 原始費率</label>
      </div>
    </div>
  </div>

<script>
// ══════════════════════════════════════════════════════
//  ⚙️  換成你的 Apps Script Web App 網址
const API_URL = 'https://script.google.com/a/macros/wingea.vip/s/AKfycbykkmL9TfhqxhFb7WZWPkrZjwqiTPrIQq_RyuhoBg6Q9sIUABW4JrcKsw6t2a-vc32f7g/exec';
// ══════════════════════════════════════════════════════

const SITE_ORDER = ['CNY001','CNY002','CNY003','CNY004','CNY005','VND001','USDT001','INR001'];
const SITE_LABEL = {CNY001:'新博 CNY001',CNY002:'庫里南 CNY002',CNY003:'688娛樂 CNY003',CNY004:'Lebo-CNY CNY004',CNY005:'X11Club CNY005',VND001:'Lucky7 VND001',USDT001:'Lebo-USDT USDT001',INR001:'星辰XC INR001'};
const SITE_NAME  = {CNY001:'新博國際',CNY002:'庫里南',CNY003:'688娛樂',CNY004:'Lebo-CNY',CNY005:'X11Club',VND001:'Lucky7',USDT001:'Lebo-USDT',INR001:'星辰XC'};
const SITE_KEY   = {CNY001:'新博 CNY001',CNY002:'庫里南 CNY002',CNY003:'688娛樂 CNY003',CNY004:'Lebo-CNY CNY004',CNY005:'X11Club CNY005',VND001:'Lucky7 VND001',USDT001:'Lebo-USDT USDT001',INR001:'星辰XC INR001'};
const CAT_OPTS = [
  {v:'slots',l:'Slots 電子',dot:'#1d4ed8'},{v:'live',l:'Live 視訊',dot:'#065f46'},
  {v:'sports',l:'Sports 體育',dot:'#92400e'},{v:'lottery',l:'Lottery 彩票',dot:'#5b21b6'},
  {v:'fish',l:'Fish 捕魚',dot:'#166534'},{v:'poker',l:'Poker 棋牌',dot:'#9d174d'},
  {v:'mini game',l:'Mini Game',dot:'#9a3412'},{v:'e-sports',l:'E-Sports',dot:'#0c4a6e'},
  {v:'cockfight',l:'Cockfight',dot:'#991b1b'},
];
const SRC_OPTS  = ['自研','ZF one api','ZF單接','OMG集成','HG集成','IM集成','單接','JVD FA api'].map(v=>({v,l:v}));
const SITE_OPTS = SITE_ORDER.map(v=>({v,l:SITE_LABEL[v]}));
const CAT_CLS = {slots:'b-slots',live:'b-live',sports:'b-sports',lottery:'b-lottery',fish:'b-fish',poker:'b-poker','mini game':'b-mini','e-sports':'b-esports',cockfight:'b-cock'};
const CAT_LBL = {slots:'Slots',live:'Live',sports:'Sports',lottery:'彩票',fish:'Fish',poker:'棋牌','mini game':'Mini','e-sports':'E-Sports',cockfight:'鬥雞'};
const CUR_ORIG = {CNY:'原始費率CNY',VND:'原始費率VND',USD:'原始費率USD/USDT',INR:'原始費率INR',KRW:'原始費率KRW',PHP:'原始費率PHP'};

const DD_CFG = {cat:{opts:CAT_OPTS},src:{opts:SRC_OPTS},site:{opts:SITE_OPTS}};
const ddSel  = {cat:new Set(), src:new Set(), site:new Set()};
const ddOpen = {cat:false, src:false, site:false};

let DATA_BY_CUR = {}, SITE_INFO = [], curCur = 'CNY';
let view='table', sortK=null, sortD=1, editingId=null;

// ── API ───────────────────────────────────────────────
async function apiGet(a){const r=await fetch(`${API_URL}?action=${a}`);return r.json();}
async function apiPost(b){
  // Apps Script 不支援跨域 POST，改用 GET + payload 參數
  const encoded = encodeURIComponent(JSON.stringify(b));
  const r = await fetch(`${API_URL}?payload=${encoded}`);
  return r.json();
}

async function loadAll(){
  try{
    const [pRes,sRes]=await Promise.all([apiGet('getAll'),apiGet('getSites')]);
    const all=pRes.providers||[];
    SITE_INFO=sRes.sites||[];
    // group by currency — for now all providers share same rate plans; orig differs per currency sheet
    // We'll load per-currency data from separate endpoint or just show CNY data with orig from master
    const CUR_KEY={CNY:'orig_cny',VND:'orig_vnd',USD:'orig_usd',INR:'orig_inr',KRW:'orig_krw',PHP:'orig_php'};
    ['CNY','VND','USD','INR','KRW','PHP'].forEach(cur=>{
      DATA_BY_CUR[cur]=all.map(p=>({...p, orig: p[CUR_KEY[cur]]??null}));
    });
    document.getElementById('syncLabel').textContent='已同步 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){
    document.getElementById('mainContent').innerHTML=`<div class="state"><div style="font-size:28px;margin-bottom:10px">⚠</div><div style="color:var(--red);margin-bottom:6px">無法連線</div><div style="font-size:12px;color:var(--t3)">請確認 Apps Script 已部署並填入 API_URL<br>${e.message}</div></div>`;
    document.getElementById('syncLabel').textContent='連線失敗';
  }
}

// ── Dropdown ─────────────────────────────────────────
function renderDDList(type, query=''){
  const opts=DD_CFG[type].opts.filter(o=>o.l.toLowerCase().includes(query.toLowerCase())||o.v.toLowerCase().includes(query.toLowerCase()));
  const sel=ddSel[type];
  const el=document.getElementById('dd_'+type+'_list');
  if(!opts.length){el.innerHTML=`<div class="dd-empty">無結果</div>`;return;}
  el.innerHTML=opts.map(o=>{
    const on=sel.has(o.v);
    const dot=o.dot?`<span class="dd-dot" style="background:${o.dot}"></span>`:'';
    return `<div class="dd-item${on?' on':''}" onclick="toggleDDOpt('${type}','${o.v}');event.stopPropagation()">
      <div class="dd-cb">${on?'✓':''}</div>${dot}<span>${o.l}</span>
    </div>`;
  }).join('');
}

function toggleDD(type){
  const was=ddOpen[type];
  Object.keys(ddOpen).forEach(k=>{
    if(ddOpen[k]){ddOpen[k]=false;document.getElementById('dd_'+k+'_menu').style.display='none';document.getElementById('dd_'+k+'_btn').classList.remove('open');}
  });
  if(!was){
    ddOpen[type]=true;
    document.getElementById('dd_'+type+'_menu').style.display='';
    document.getElementById('dd_'+type+'_btn').classList.add('open');
    renderDDList(type);
  }
}

function toggleDDOpt(type,val){
  const s=ddSel[type];
  if(s.has(val))s.delete(val);else s.add(val);
  renderDDList(type);updateBadge(type);updateSelStrip();render();
}
function clearDD(type){ddSel[type].clear();renderDDList(type);updateBadge(type);updateSelStrip();render();}
function allDD(type){DD_CFG[type].opts.forEach(o=>ddSel[type].add(o.v));renderDDList(type);updateBadge(type);updateSelStrip();render();}

function updateBadge(type){
  const n=ddSel[type].size;
  const b=document.getElementById('dd_'+type+'_badge');
  b.textContent=n;b.style.display=n?'':'none';
  document.getElementById('dd_'+type+'_btn').classList.toggle('has',n>0);
}

function updateSelStrip(){
  const strip=document.getElementById('selStrip');
  const tags=[];
  [{k:'cat',opts:CAT_OPTS},{k:'src',opts:SRC_OPTS},{k:'site',opts:SITE_OPTS}].forEach(({k,opts})=>{
    ddSel[k].forEach(v=>{
      const o=opts.find(x=>x.v===v);
      const lbl=o?o.l:v;
      tags.push(`<span class="sel-tag">${lbl}<span class="rm" onclick="toggleDDOpt('${k}','${v}')"> ×</span></span>`);
    });
  });
  strip.innerHTML=tags.join('');
  strip.style.display=tags.length?'flex':'none';
}

function clearAll(){
  ['cat','src','site'].forEach(t=>{ddSel[t].clear();updateBadge(t);});
  updateSelStrip();
  document.getElementById('q').value='';
  render();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.dd')){
    Object.keys(ddOpen).forEach(k=>{
      if(ddOpen[k]){ddOpen[k]=false;document.getElementById('dd_'+k+'_menu').style.display='none';document.getElementById('dd_'+k+'_btn').classList.remove('open');}
    });
  }
});

// ── Currency ──────────────────────────────────────────
function setCur(cur, btn){
  curCur=cur;
  document.querySelectorAll('.cur-tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

// ── Filter + Sort ─────────────────────────────────────
function ck(id){return document.getElementById(id)?.checked;}
function pct(v){
  if(v===null||v===undefined)return null;
  if(v==='N/A')return 'N/A';
  return (v*100).toFixed(1)+'%';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function getFiltered(){
  const q=document.getElementById('q').value.toLowerCase();
  const data=DATA_BY_CUR[curCur]||[];
  return data.filter(d=>{
    if(q&&!d.en.toLowerCase().includes(q)&&!d.cn.includes(q)&&!(d.source||'').toLowerCase().includes(q)&&!(d.prov_code||'').toLowerCase().includes(q))return false;
    if(ddSel.cat.size&&!ddSel.cat.has(d.cat))return false;
    if(ddSel.src.size&&!ddSel.src.has(d.source))return false;
    if(ddSel.site.size){
      const has=[...ddSel.site].some(s=>{const sv=d.sites?.[s];return sv&&sv.r!==null;});
      if(!has)return false;
    }
    return true;
  });
}

function getActiveSites(){return ddSel.site.size?[...ddSel.site]:SITE_ORDER;}

function doSort(k){if(sortK===k)sortD=-sortD;else{sortK=k;sortD=1;}render();}
function sarr(k){if(sortK!==k)return'<span class="sarr">↕</span>';return`<span class="sarr">${sortD>0?'↑':'↓'}</span>`;}
function th(k,l,ex=''){return`<th onclick="doSort('${k}')" class="${sortK===k?'sorted':''}" ${ex}>${l}${sarr(k)}</th>`;}

function render(){
  if(!Object.keys(DATA_BY_CUR).length)return;
  let data=getFiltered();
  const sites=getActiveSites();
  if(sortK){
    data.sort((a,b)=>{
      if(sortK==='en')return sortD*a.en.localeCompare(b.en);
      if(sortK==='cat')return sortD*a.cat.localeCompare(b.cat);
      if(sortK==='src')return sortD*(a.source||'').localeCompare(b.source||'');
      if(sortK==='p1')return sortD*((a.p1??9)-(b.p1??9));
      if(sortK==='p2')return sortD*((a.p2??9)-(b.p2??9));
      if(sortK==='p3')return sortD*((a.p3??9)-(b.p3??9));
      const av=(a.sites?.[sortK]?.r??9),bv=(b.sites?.[sortK]?.r??9);
      return sortD*(av-bv);
    });
  }
  if(view==='table')renderTable(data,sites);
  else renderSite(data);
}

function renderTable(data,sites){
  const origLabel=CUR_ORIG[curCur]||'原始費率';
  let head='<tr>'+th('en','供應商')+th('cat','類別');
  if(ck('ck_src'))     head+=th('src','遊戲來源');
  if(ck('ck_cat_icon'))head+='<th>category_icon</th>';
  if(ck('ck_bal_icon'))head+='<th>balance_icon</th>';
  if(ck('ck_prov'))    head+='<th>provider_code</th>';
  if(ck('ck_ext'))     head+='<th>ext_category_code</th>';
  if(ck('ck_ctrl'))    head+='<th style="text-align:center">可控</th>';
  if(ck('ck_enabled')) head+='<th style="text-align:center">全域啟用</th>';
  if(ck('ck_p1'))      head+=th('p1','方案一','style="text-align:right"');
  if(ck('ck_p2'))      head+=th('p2','方案二','style="text-align:right"');
  if(ck('ck_p3'))      head+=th('p3','方案三','style="text-align:right"');
  if(ck('ck_official'))head+='<th class="orig-h">官方費率</th>';
  if(ck('ck_orig'))    head+=`<th class="orig-h">${origLabel}</th>`;
  sites.forEach(s=>head+=th(s,SITE_LABEL[s]?.split(' ')[0]||s,'style="text-align:right"'));
  head+='<th style="text-align:center">操作</th></tr>';

  let rows='';
  data.forEach(d=>{
    const cc=CAT_CLS[d.cat]||'b-esports',cl=CAT_LBL[d.cat]||d.cat;
    let r=`<tr><td style="max-width:170px"><div class="td-en">${esc(d.en)}</div><div class="td-cn">${esc(d.cn)}</div>${d.note?`<div class="td-note">${esc(d.note)}</div>`:''}</td>`;
    r+=`<td><span class="badge ${cc}">${cl}</span></td>`;
    if(ck('ck_src'))     r+=`<td><span class="src-tag">${d.source||'—'}</span></td>`;
    if(ck('ck_cat_icon'))r+=`<td class="mono">${d.cat_icon?`<span title="${d.cat_icon}">${d.cat_icon.slice(0,22)}…</span>`:'—'}</td>`;
    if(ck('ck_bal_icon'))r+=`<td class="mono">${d.bal_icon?`<span title="${d.bal_icon}">${d.bal_icon.slice(0,20)}…</span>`:'—'}</td>`;
    if(ck('ck_prov'))    r+=`<td class="mono">${d.prov_code?`<span title="${d.prov_code}">${d.prov_code}</span>`:'—'}</td>`;
    if(ck('ck_ext'))     r+=`<td class="mono">${d.ext_cat||'—'}</td>`;
    if(ck('ck_ctrl'))    r+=`<td class="td-ctr"><span class="${d.ctrl==='Y'?'cy':'cn2'}">${d.ctrl==='Y'?'✓':'✗'}</span></td>`;
    if(ck('ck_enabled')) r+=`<td class="td-ctr"><span class="${d.enabled==='Y'?'cy':'cn2'}">${d.enabled==='Y'?'✓':'✗'}</span></td>`;

    const fmtRate=(v)=>v===null?'<span style="color:var(--t3)">—</span>':v==='N/A'?'<span style="color:var(--t3)">不支持</span>':pct(v);
    if(ck('ck_p1'))      r+=`<td class="td-rc">${fmtRate(d.p1)}</td>`;
    if(ck('ck_p2'))      r+=`<td class="td-rc">${fmtRate(d.p2)}</td>`;
    if(ck('ck_p3'))      r+=`<td class="td-rc">${fmtRate(d.p3)}</td>`;
    if(ck('ck_official'))r+=`<td style="text-align:right;color:var(--t3);font-size:11px">${fmtRate(d.official)}</td>`;
    if(ck('ck_orig'))    r+=`<td style="text-align:right;color:var(--t3);font-size:11px">${fmtRate(d.orig)}</td>`;

    sites.forEach(s=>{
      const sv=d.sites?.[s];
      if(!sv||sv.r===null){
        r+=`<td class="null-cell" onclick="editRate(${d.id},'${s}',null,null,null)">＋</td>`;
      }else{
        const ei=sv.enabled?`<span style="font-size:9px;color:${sv.enabled==='Y'?'var(--green)':'var(--t3)'}">${sv.enabled==='Y'?' ✓':' ✗'}</span>`:'';
        r+=`<td class="rc-click" onclick="editRate(${d.id},'${s}',${sv.r},${sv.p},${JSON.stringify(sv.enabled||'')})">
          <span style="font-size:12px">${pct(sv.r)}${ei}</span>${sv.p!==null?`<div class="profit">+${pct(sv.p)}</div>`:''}
        </td>`;
      }
    });
    r+=`<td class="td-ctr"><div class="abtns">
      <button class="btn btn-gho btn-sm" onclick="openEdit(${d.id})">編輯</button>
      <button class="btn btn-dan btn-sm" onclick="delRow(${d.id},'${esc(d.en)}')">刪除</button>
    </div></td></tr>`;
    rows+=r;
  });

  document.getElementById('mainContent').innerHTML=`
    <div class="tbl-wrap">
      <div class="tbl-scroll"><table><thead>${head}</thead><tbody>${rows||`<tr><td colspan="40" style="text-align:center;padding:24px;color:var(--t3);font-size:13px">無符合結果</td></tr>`}</tbody></table></div>
      <div class="tbl-footer">共 ${data.length} 筆 · 幣別：${curCur} · 點費率格可直接修改 · ＋ 表示尚未設定</div>
    </div>`;
}

function renderSite(filteredData){
  const cards=SITE_INFO.map(si=>{
    const count=filteredData.filter(d=>d.sites?.[si.id]?.r!==null).length;
    return `<div class="sc">
      <div class="sc-head"><div class="sc-name">${esc(si.name)}<span class="sc-id">${si.id}</span></div><div class="sc-backend">${si.backend}</div></div>
      <div class="sc-body">
        <div class="sc-row"><span class="sc-lbl">幣別</span><span class="sc-val">${si.currency}</span></div>
        <div class="sc-row"><span class="sc-lbl">方案</span><span class="sc-val">${si.plan}</span></div>
        <div class="sc-row"><span class="sc-lbl">默認語系</span><span class="sc-val">${si.lang}</span></div>
        <div class="sc-row"><span class="sc-lbl">支持語系</span><span class="sc-val" style="font-size:11px">${si.langs}</span></div>
        <div class="sc-row"><span class="sc-lbl">押金</span><span class="sc-val">${si.deposit>0?si.deposit+' u':'免'}</span></div>
        <div class="sc-row"><span class="sc-lbl">開站費</span><span class="sc-val">${si.setup>0?si.setup+' u':'免'}</span></div>
        <div class="sc-row"><span class="sc-lbl">維護費</span><span class="sc-val">${si.maint>0?si.maint+' u / 月':'免'}</span></div>
        <div class="sc-row"><span class="sc-lbl">每月買分</span><span class="sc-val">${si.monthly||0}</span></div>
        ${si.note?`<div class="sc-row"><span class="sc-lbl">備註</span><span class="sc-val warn">${esc(si.note)}</span></div>`:''}
        <div class="sc-count">${count} 個供應商已設費率</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('mainContent').innerHTML=`<div class="site-grid">${cards}</div>`;
}

// ── Inline rate edit ──────────────────────────────────
function editRate(id,siteId,curR,curP,curE){
  const rS=curR!==null?(curR*100).toFixed(1):'';
  const pS=curP!==null?(curP*100).toFixed(1):'';
  const rate=prompt(`[${SITE_LABEL[siteId]}] 費率 (%)\n目前：${rS||'未設定'}`,rS);
  if(rate===null)return;
  const profit=prompt(`[${SITE_LABEL[siteId]}] 利潤 % (可留空)`,pS);
  if(profit===null)return;
  const enabled=prompt(`[${SITE_LABEL[siteId]}] 預設啟用？Y / N\n目前：${curE||'未設定'}`,curE||'Y');
  if(enabled===null)return;
  const rv=rate===''?null:parseFloat(rate)/100;
  const pv=profit===''?null:parseFloat(profit)/100;
  const ev=enabled.toUpperCase()==='Y'?'Y':enabled.toUpperCase()==='N'?'N':'';
  apiPost({action:'updateSiteRate',siteId,providerId:id,rate:rv,profit:pv,enabled:ev})
    .then(res=>{
      if(res.error){toast('錯誤：'+res.error,true);return;}
      Object.values(DATA_BY_CUR).forEach(arr=>{const d=arr.find(x=>x.id===id);if(d&&d.sites)d.sites[siteId]={r:rv,p:pv,enabled:ev};});
      toast('已更新 ✓');render();
    }).catch(e=>toast('連線錯誤：'+e.message,true));
}

// ── Modal ─────────────────────────────────────────────
function buildSiteBlocks(sites){
  return SITE_ORDER.map(sid=>{
    const sd=sites?.[sid]||{r:null,p:null,enabled:'Y'};
    const on=sd.enabled!=='N';
    return `<div class="site-block">
      <div class="sb-hd">
        <div class="sb-name">${SITE_NAME[sid]}<span class="sb-id">${sid}</span></div>
        <div class="sb-tog">預設啟用
          <div class="tog-track ${on?'on':''}" id="tgl_${sid}" onclick="toggleSite('${sid}')"><div class="tog-thumb"></div></div>
          <span id="tgl_lbl_${sid}" style="font-size:11px;font-weight:500;color:${on?'var(--green)':'var(--t3)'}">${on?'Y':'N'}</span>
        </div>
      </div>
      <div class="sb-body${on?'':' dim'}" id="sb_body_${sid}">
        <div class="fgp"><label class="fl">站點費率</label><input class="fi" id="sr_${sid}" type="number" step="0.001" value="${sd.r!==null?sd.r:''}" placeholder="e.g. 0.09"></div>
        <div class="fgp"><label class="fl">利潤 %</label><input class="fi" id="sp_${sid}" type="number" step="0.001" value="${sd.p!==null?sd.p:''}" placeholder="e.g. 0.04"></div>
      </div>
    </div>`;
  }).join('');
}

function toggleSite(sid){
  const t=document.getElementById('tgl_'+sid),l=document.getElementById('tgl_lbl_'+sid),b=document.getElementById('sb_body_'+sid);
  const on=t.classList.toggle('on');
  l.textContent=on?'Y':'N';l.style.color=on?'var(--green)':'var(--t3)';
  b.classList.toggle('dim',!on);
}

function openAdd(){
  editingId=null;
  document.getElementById('moTitle').textContent='新增供應商';
  document.getElementById('moSaveBtn').textContent='新增';
  ['f_en','f_cn','f_note','f_prov','f_ext','f_cat_icon','f_bal_icon','f_p1','f_p2','f_p3','f_official'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('f_cat').value='slots';
  document.getElementById('f_source').value='ZF one api';
  document.getElementById('f_ctrl').value='N';
  document.getElementById('f_enabled').value='N';
  document.getElementById('siteBlocks').innerHTML=buildSiteBlocks(null);
  document.getElementById('overlay').style.display='flex';
}

function openEdit(id){
  const data=DATA_BY_CUR[curCur]||[];
  const d=data.find(x=>x.id===id);if(!d)return;
  editingId=id;
  document.getElementById('moTitle').textContent='編輯 — '+d.en;
  document.getElementById('moSaveBtn').textContent='儲存所有變更';
  document.getElementById('f_en').value=d.en||'';
  document.getElementById('f_cn').value=d.cn||'';
  document.getElementById('f_cat').value=d.cat||'slots';
  document.getElementById('f_source').value=d.source||'ZF one api';
  document.getElementById('f_ctrl').value=d.ctrl||'N';
  document.getElementById('f_enabled').value=d.enabled||'N';
  document.getElementById('f_note').value=d.note||'';
  document.getElementById('f_prov').value=d.prov_code||'';
  document.getElementById('f_ext').value=d.ext_cat||'';
  document.getElementById('f_cat_icon').value=d.cat_icon||'';
  document.getElementById('f_bal_icon').value=d.bal_icon||'';
  document.getElementById('f_p1').value=d.p1??'';
  document.getElementById('f_p2').value=d.p2??'';
  document.getElementById('f_p3').value=d.p3??'';
  document.getElementById('f_official').value=d.official??'';
  document.getElementById('siteBlocks').innerHTML=buildSiteBlocks(d.sites);
  document.getElementById('overlay').style.display='flex';
}

function closeMo(){document.getElementById('overlay').style.display='none';}

async function saveMo(){
  const sites={};
  SITE_ORDER.forEach(s=>{
    const r=document.getElementById('sr_'+s)?.value;
    const p=document.getElementById('sp_'+s)?.value;
    const on=document.getElementById('tgl_'+s)?.classList.contains('on');
    sites[s]={r:r?parseFloat(r):null,p:p?parseFloat(p):null,enabled:on?'Y':'N'};
  });
  const payload={en:document.getElementById('f_en').value.trim(),cn:document.getElementById('f_cn').value.trim(),cat:document.getElementById('f_cat').value,source:document.getElementById('f_source').value,ctrl:document.getElementById('f_ctrl').value,enabled:document.getElementById('f_enabled').value,note:document.getElementById('f_note').value.trim(),prov_code:document.getElementById('f_prov').value.trim(),ext_cat:document.getElementById('f_ext').value.trim(),cat_icon:document.getElementById('f_cat_icon').value.trim(),bal_icon:document.getElementById('f_bal_icon').value.trim(),p1:parseFloat(document.getElementById('f_p1').value)||null,p2:parseFloat(document.getElementById('f_p2').value)||null,p3:parseFloat(document.getElementById('f_p3').value)||null,official:parseFloat(document.getElementById('f_official').value)||null,sites};
  const btn=document.getElementById('moSaveBtn');
  btn.textContent='儲存中…';btn.disabled=true;
  try{
    const res=await apiPost(editingId!==null?{action:'updateProvider',data:{id:editingId,...payload}}:{action:'addProvider',data:payload});
    if(res.error){toast('錯誤：'+res.error,true);return;}
    closeMo();toast(editingId!==null?'已儲存 ✓':'已新增 ✓');await loadAll();
  }catch(e){toast('連線錯誤：'+e.message,true);}
  finally{btn.textContent=editingId!==null?'儲存所有變更':'新增';btn.disabled=false;}
}

async function delRow(id,name){
  if(!confirm(`確定刪除「${name}」？`))return;
  try{const res=await apiPost({action:'deleteProvider',id});if(res.error){toast('錯誤：'+res.error,true);return;}toast('已刪除 ✓');await loadAll();}catch(e){toast('連線錯誤：'+e.message,true);}
}

function toast(msg,isErr=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(isErr?' err':'');
  setTimeout(()=>t.className='toast',3000);
}

function switchView(v){
  view=v;
  document.getElementById('btnT').className='tab'+(v==='table'?' on':'');
  document.getElementById('btnS').className='tab'+(v==='site'?' on':'');
  render();
}


// ── Auth ──────────────────────────────────────────────
const CLIENT_ID = '1031858151521-k4a6p25nd81oiuio7id9d9p5odacgqdr.apps.googleusercontent.com';
const ALLOWED_DOMAIN = 'wingea.vip';
let currentUser = null;

function initAuth(){
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredential,
    auto_select: true,
  });
  google.accounts.id.renderButton(
    document.getElementById('g_id_signin'),
    {theme:'outline', size:'large', text:'signin_with', locale:'zh-TW', width:280}
  );
  google.accounts.id.prompt();
}

function handleCredential(response){
  // Google JWT 用 base64url，需先轉成標準 base64
  const base64url = response.credential.split('.')[1];
  const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  const payload = JSON.parse(atob(base64));
  const email   = payload.email || '';
  const domain  = email.split('@')[1] || '';
  if(domain !== ALLOWED_DOMAIN){
    const err = document.getElementById('loginErr');
    err.textContent = `帳號 ${email} 沒有存取權限，請用 @wingea.vip 帳號登入。`;
    err.style.display = 'block';
    return;
  }
  currentUser = { email, name: payload.name, picture: payload.picture };
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('userInfo').innerHTML =
    `<img src="${payload.picture}" style="width:28px;height:28px;border-radius:50%;margin-right:6px;vertical-align:middle">` +
    `<span style="font-size:12px;color:var(--t2)">${payload.name}</span>` +
    `<button onclick="signOut()" style="margin-left:10px;height:26px;padding:0 10px;font-size:11px;border:1px solid var(--bdr);border-radius:6px;background:transparent;color:var(--t2);cursor:pointer">登出</button>`;
  loadAll();
}

function signOut(){
  google.accounts.id.disableAutoSelect();
  currentUser = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('userInfo').innerHTML = '';
  document.getElementById('mainContent').innerHTML = '<div class="state"><div class="spin"></div>請先登入</div>';
}

// 等 GSI script 載入完成後初始化，用 polling 確保不漏掉
function waitForGoogle(){
  if(typeof google !== 'undefined' && google.accounts && google.accounts.id){
    initAuth();
  } else {
    setTimeout(waitForGoogle, 100);
  }
}
waitForGoogle();
